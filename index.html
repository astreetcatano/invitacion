<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Halloween 3312680</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --orange: #ff6600;
            --purple: #9d00ff;
            --green: #00ff66;
            --dark-bg: #0b0612;
            --card-bg: rgba(23, 12, 38, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--orange);
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 102, 0, 0.35), inset 0 0 20px rgba(157, 0, 255, 0.25);
            backdrop-filter: blur(12px);
            animation: floatContainer 6s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .banner-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--orange);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
            margin-bottom: 20px;
            position: relative;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .banner-container:hover .banner-img {
            transform: scale(1.05);
        }

        .pumpkin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 12px var(--orange));
        }

        .pumpkin-icon:hover {
            transform: scale(1.15) rotate(5deg);
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 2.5rem;
            color: var(--orange);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.8), 0 0 20px rgba(157, 0, 255, 0.6);
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .catchphrase {
            font-size: 1.05rem;
            color: #e0d5f5;
            font-style: italic;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .details-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
        }

        .detail-icon {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }

        .dress-code-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--green), #009933);
            color: #000;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--purple);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(157, 0, 255, 0.15);
            padding: 12px;
            border-radius: 16px;
            border: 1px dashed var(--purple);
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val {
            font-family: 'Creepster', cursive;
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 8px var(--purple);
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, var(--orange), #cc5200);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.8);
        }

        .btn.confirmed {
            background: linear-gradient(135deg, var(--green), #009933) !important;
            color: #000 !important;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.7) !important;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 25px 18px; }
            .time-val { font-size: 1.5rem; }
        }

        @media (min-width: 769px) {
            body {
                height: 100vh;
                min-height: 0;
                overflow-y: hidden;
                padding: 12px;
            }

            .container {
                padding: 10px 22px;
            }

            .banner-container {
                margin-bottom: 12px;
            }

            .banner-img {
                max-height: 175px;
            }

            .pumpkin-icon {
                width: 58px;
                height: 58px;
                margin-bottom: 6px;
            }

            h1 {
                margin-bottom: 5px;
            }

            .catchphrase {
                margin-bottom: 12px;
            }

            .details-box {
                padding: 12px;
                margin-bottom: 12px;
                gap: 8px;
            }

            .countdown {
                margin-bottom: 15px;
                padding: 8px;
            }

            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>

        // Audio Synth
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSpookyLaugh() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 1.2);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 1.2);
        }

            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // RSVP Handler
        let isConfirmed = false;
        function confirmAttendance() {
            const btn = document.getElementById('rsvp-btn');
            isConfirmed = !isConfirmed;

            if (isConfirmed) {
                btn.classList.add('confirmed');
                btn.innerHTML = '<span>✅</span> ¡ASISTENCIA CONFIRMADA! 🎃';
                playCelebrateSound();

                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff6600', '#9d00ff', '#00ff66', '#ffffff']
                });
            } else {
                btn.classList.remove('confirmed');
                btn.innerHTML = '<span>🎃</span> CONFIRMAR ASISTENCIA';
            }
        }

        // Countdown Logic
        function updateCountdown() {
            const currentYear = new Date().getFullYear();
            let eventDate = new Date(`October 30, ${currentYear} 14:00:00`).getTime();
            const now = new Date().getTime();

            if (now > eventDate) {
                eventDate = new Date(`October 30, ${currentYear + 1} 14:00:00`).getTime();
            }

            const diff = eventDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Animation (Bats)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bat {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 15 + 10;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.wingAngle = 0;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.wingAngle += 0.15;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(157, 0, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                
                const wingY = Math.sin(this.wingAngle) * (this.size * 0.4);
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x - this.size, this.y - this.size + wingY, this.x - this.size * 1.5, this.y + wingY);
                ctx.quadraticCurveTo(this.x - this.size * 0.8, this.y + this.size * 0.5, this.x, this.y);

                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + this.size, this.y - this.size + wingY, this.x + this.size * 1.5, this.y + wingY);
                ctx.quadraticCurveTo(this.x + this.size * 0.8, this.y + this.size * 0.5, this.x, this.y);
                
                ctx.fill();
            }
        }

        const bats = Array.from({ length: 15 }, () => new Bat());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bats.forEach(bat => {
                bat.update();
                bat.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
