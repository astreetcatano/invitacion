<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Halloween 3312680</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --orange: #ff6600;
            --purple: #9d00ff;
            --green: #00ff66;
            --dark-bg: #0b0612;
            --card-bg: rgba(23, 12, 38, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--orange);
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 102, 0, 0.35), inset 0 0 20px rgba(157, 0, 255, 0.25);
            backdrop-filter: blur(12px);
            animation: floatContainer 6s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .banner-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--orange);
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.4);
            margin-bottom: 20px;
            position: relative;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .banner-container:hover .banner-img {
            transform: scale(1.05);
        }

        .pumpkin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 12px var(--orange));
        }

        .pumpkin-icon:hover {
            transform: scale(1.15) rotate(5deg);
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 2.5rem;
            color: var(--orange);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.8), 0 0 20px rgba(157, 0, 255, 0.6);
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .catchphrase {
            font-size: 1.05rem;
            color: #e0d5f5;
            font-style: italic;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .details-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
        }

        .detail-icon {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }

        .dress-code-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--green), #009933);
            color: #000;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--purple);
            font-weight: 800;
            margin-bottom: 10px;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(157, 0, 255, 0.15);
            padding: 12px;
            border-radius: 16px;
            border: 1px dashed var(--purple);
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val {
            font-family: 'Creepster', cursive;
            font-size: 1.8rem;
            color: #ffffff;
            text-shadow: 0 0 8px var(--purple);
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, var(--orange), #cc5200);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.8);
        }

        .btn.confirmed {
            background: linear-gradient(135deg, var(--green), #009933) !important;
            color: #000 !important;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.7) !important;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 25px 18px; }
            .time-val { font-size: 1.5rem; }
        }

        @media (min-width: 769px) {
            body {
                height: 100vh;
                min-height: 0;
                overflow-y: hidden;
                padding: 12px;
            }

            .container {
                padding: 10px 22px;
            }

            .banner-container {
                margin-bottom: 12px;
            }

            .banner-img {
                max-height: 175px;
            }

            .pumpkin-icon {
                width: 58px;
                height: 58px;
                margin-bottom: 6px;
            }

            h1 {
                margin-bottom: 5px;
            }

            .catchphrase {
                margin-bottom: 12px;
            }

            .details-box {
                padding: 12px;
                margin-bottom: 12px;
                gap: 8px;
            }

            .countdown {
                margin-bottom: 15px;
                padding: 8px;
            }

            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Banner ilustrado de Halloween -->
        <div class="banner-container">
            <svg class="banner-img halloween-art" viewBox="0 0 1200 420" role="img" aria-labelledby="halloween-art-title halloween-art-desc" preserveAspectRatio="xMidYMid slice">
                <title id="halloween-art-title">Noche de Halloween</title>
                <desc id="halloween-art-desc">Luna llena sobre un castillo embrujado, murciélagos y calabazas iluminadas.</desc>
                <defs>
                    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#10051f" />
                        <stop offset="0.62" stop-color="#29104a" />
                        <stop offset="1" stop-color="#5a1d3b" />
                    </linearGradient>
                    <radialGradient id="moon-glow">
                        <stop offset="0" stop-color="#fff5bd" />
                        <stop offset="0.68" stop-color="#ffd76b" />
                        <stop offset="1" stop-color="#f58a26" stop-opacity="0" />
                    </radialGradient>
                    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
                        <stop stop-color="#160d28" />
                        <stop offset="1" stop-color="#08050f" />
                    </linearGradient>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                </defs>
                <rect width="1200" height="420" fill="url(#sky)" />
                <circle cx="890" cy="125" r="120" fill="url(#moon-glow)" opacity="0.85" />
                <circle cx="890" cy="125" r="62" fill="#ffeaa1" filter="url(#glow)" />
                <g fill="#d3a85d" opacity="0.35">
                    <circle cx="865" cy="104" r="8" /><circle cx="914" cy="145" r="11" /><circle cx="907" cy="92" r="5" />
                </g>
                <g fill="#08050f">
                    <path d="M0 330 L0 265 L35 265 L35 230 L58 230 L58 270 L83 270 L83 205 L106 205 L106 270 L135 270 L135 245 L154 245 L154 278 L187 278 L187 215 L211 215 L211 277 L244 277 L244 248 L264 248 L264 281 L300 281 L300 225 L324 225 L324 277 L362 277 L362 190 L387 190 L387 280 L418 280 L418 243 L443 243 L443 280 L475 280 L475 220 L500 220 L500 280 L538 280 L538 200 L564 200 L564 277 L594 277 L594 240 L617 240 L617 282 L650 282 L650 214 L677 214 L677 280 L710 280 L710 244 L732 244 L732 278 L770 278 L770 190 L796 190 L796 279 L830 279 L830 231 L855 231 L855 280 L890 280 L890 210 L916 210 L916 280 L950 280 L950 245 L974 245 L974 279 L1010 279 L1010 220 L1035 220 L1035 280 L1070 280 L1070 250 L1092 250 L1092 280 L1125 280 L1125 230 L1150 230 L1150 280 L1200 280 L1200 420 L0 420 Z" />
                    <path d="M392 282 L392 178 L430 178 L430 140 L446 140 L446 178 L485 178 L485 282 Z" />
                    <path d="M412 142 L438 108 L465 142 Z" />
                    <path d="M710 282 L710 160 L747 160 L747 125 L765 125 L765 160 L805 160 L805 282 Z" />
                    <path d="M726 126 L756 90 L785 126 Z" />
                </g>
                <g fill="#ffb52e" opacity="0.9">
                    <path d="M425 178 h12 v18 h-12z M462 178 h12 v18 h-12z M741 162 h12 v19 h-12z M781 162 h12 v19 h-12z" />
                </g>
                <path d="M0 354 Q160 315 320 355 T640 350 T960 355 T1200 342 V420 H0Z" fill="url(#hill)" />
                <g transform="translate(175 330)">
                    <path d="M0 50 Q5 0 48 0 Q91 0 96 50Z" fill="#f07818" stroke="#ffb52e" stroke-width="4" />
                    <path d="M48 2 V-16" stroke="#67ad39" stroke-width="8" stroke-linecap="round" />
                    <path d="M18 18 Q48 30 78 18 M12 35 Q48 45 84 35" fill="none" stroke="#bd4812" stroke-width="5" />
                    <path d="M28 22 l12 8 -12 8z M56 22 l12 8 -12 8z M35 42 q13 10 26 0" fill="#21102e" />
                </g>
                <g transform="translate(1000 345) scale(.8)">
                    <path d="M0 50 Q5 0 48 0 Q91 0 96 50Z" fill="#f07818" stroke="#ffb52e" stroke-width="4" />
                    <path d="M48 2 V-16" stroke="#67ad39" stroke-width="8" stroke-linecap="round" />
                    <path d="M18 18 Q48 30 78 18 M12 35 Q48 45 84 35" fill="none" stroke="#bd4812" stroke-width="5" />
                    <path d="M28 22 l12 8 -12 8z M56 22 l12 8 -12 8z M35 42 q13 10 26 0" fill="#21102e" />
                </g>
                <g fill="#090510">
                    <path d="M210 90 q22-28 44 0 l25-14-10 34 18 20-33-10-22 20-22-20-33 10 18-20-10-34z" />
                    <path d="M530 75 q18-22 36 0 l22-12-9 28 15 16-27-8-19 16-19-16-27 8 15-16-9-28z" />
                    <path d="M1050 105 q20-25 40 0 l24-13-9 31 16 18-30-9-21 18-21-18-30 9 16-18-9-31z" />
                </g>
                <text x="600" y="390" text-anchor="middle" fill="#ffd76b" font-family="Outfit, sans-serif" font-size="20" font-weight="800" letter-spacing="7">UNA NOCHE DE TERROR</text>
            </svg>
        </div>

        <!-- SVG Pumpkin -->
        <svg class="pumpkin-icon" viewBox="0 0 100 100" onclick="playSpookyLaugh()">
            <path d="M50 15 C 55 5, 65 5, 58 18 C 85 18, 95 40, 95 65 C 95 90, 75 95, 50 95 C 25 95, 5 90, 5 65 C 5 40, 15 18, 42 18 C 35 5, 45 5, 50 15 Z" fill="#ff6600"/>
            <polygon points="30,45 42,45 36,35" fill="#0b0612"/>
            <polygon points="58,45 70,45 64,35" fill="#0b0612"/>
            <polygon points="46,55 54,55 50,48" fill="#0b0612"/>
            <path d="M25 68 Q 35 80 50 80 Q 65 80 75 68 Q 65 72 50 72 Q 35 72 25 68 Z" fill="#0b0612"/>
            <polygon points="32,69 36,74 40,69" fill="#ff6600"/>
            <polygon points="60,69 64,74 68,69" fill="#ff6600"/>
        </svg>

        <h1>EVENTO HALLOWEEN 3312680</h1>
        <p class="catchphrase">"¡Una tarde de misterio, sustos y diversión insuperable! ¿Te atreves a cruzar el umbral?"</p>

        <div class="details-box">
            <div class="detail-item">
                <span class="detail-icon">📅</span>
                <div><strong>Fecha:</strong> 30 de Octubre</div>
            </div>
            <div class="detail-item">
                <span class="detail-icon">⏰</span>
                <div><strong>Hora:</strong> 2:00 PM</div>
            </div>
            <div class="detail-item">
                <span class="detail-icon">📍</span>
                <div><strong>Ubicación:</strong> Piso 4, Ambiente 407</div>
            </div>
            <div class="detail-item">
                <span class="detail-icon">🎭</span>
                <div><strong>Código de Vestimenta:</strong> <span class="dress-code-badge">¡Disfraz Libre!</span></div>
            </div>
        </div>

        <div class="countdown-title">Tiempo Restante para el Terror</div>
        <div class="countdown">
            <div class="time-unit"><span class="time-val" id="days">00</span><span class="time-label">Días</span></div>
            <div class="time-unit"><span class="time-val" id="hours">00</span><span class="time-label">Horas</span></div>
            <div class="time-unit"><span class="time-val" id="minutes">00</span><span class="time-label">Min</span></div>
            <div class="time-unit"><span class="time-val" id="seconds">00</span><span class="time-label">Seg</span></div>
        </div>

        <div class="btn-stack">
            <button class="btn" id="rsvp-btn" onclick="confirmAttendance()">
                <span>🎃</span> CONFIRMAR ASISTENCIA
            </button>
        </div>
    </div>

    <script>
        // Audio Synth
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSpookyLaugh() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 1.2);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 1.2);
        }

        function playCelebrateSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // RSVP Handler
        let isConfirmed = false;
        function confirmAttendance() {
            const btn = document.getElementById('rsvp-btn');
            isConfirmed = !isConfirmed;

            if (isConfirmed) {
                btn.classList.add('confirmed');
                btn.innerHTML = '<span>✅</span> ¡ASISTENCIA CONFIRMADA! 🎃';
                playCelebrateSound();

                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff6600', '#9d00ff', '#00ff66', '#ffffff']
                });
            } else {
                btn.classList.remove('confirmed');
                btn.innerHTML = '<span>🎃</span> CONFIRMAR ASISTENCIA';
            }
        }

        // Countdown Logic
        function updateCountdown() {
            const currentYear = new Date().getFullYear();
            let eventDate = new Date(`October 30, ${currentYear} 14:00:00`).getTime();
            const now = new Date().getTime();

            if (now > eventDate) {
                eventDate = new Date(`October 30, ${currentYear + 1} 14:00:00`).getTime();
            }

            const diff = eventDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Canvas Animation (Bats)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bat {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 15 + 10;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.wingAngle = 0;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.wingAngle += 0.15;

                if (this.y < -30) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(157, 0, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                
                const wingY = Math.sin(this.wingAngle) * (this.size * 0.4);
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x - this.size, this.y - this.size + wingY, this.x - this.size * 1.5, this.y + wingY);
                ctx.quadraticCurveTo(this.x - this.size * 0.8, this.y + this.size * 0.5, this.x, this.y);

                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + this.size, this.y - this.size + wingY, this.x + this.size * 1.5, this.y + wingY);
                ctx.quadraticCurveTo(this.x + this.size * 0.8, this.y + this.size * 0.5, this.x, this.y);
                
                ctx.fill();
            }
        }

        const bats = Array.from({ length: 15 }, () => new Bat());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bats.forEach(bat => {
                bat.update();
                bat.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
